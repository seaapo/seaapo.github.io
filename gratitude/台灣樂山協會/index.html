<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>小腳丫寒溪指揮中心</title>
    <base href="./">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv='cache-control' content='no-cache'>
    <meta http-equiv='expires' content='0'>
    <meta http-equiv='pragma' content='no-cache'>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"
        crossorigin="anonymous"></script>
    <script type="text/javascript" src="../script.js"></script>
</head>

<body>
    <div class="cards">
        <div class="card card-l">
            <h4>
                小腳丫寒溪指揮中心
            </h4>
            <div class="menus">
                <div id="menu-thank" class="menu active">
                    <i class="icon fa fa-heart"></i>
                </div>
                <div id="menu-questionnaire" class="menu">
                    <i class="icon fa-solid fa-pen-to-square"></i>
                </div>
            </div>
            <div class="hints">
                <div id="hint-thank" class="hint">致謝</div>
                <div id="hint-questionnaire" class="hint hidden">問卷</div>
            </div>
            <div class="date">
                <div>2024 年秋冬</div>
            </div>
        </div>
        <div class="card card-r">
            <div id="block-thank">
                <div class="content">
                    <div id="content-thank" class="center">
                    </div>
                    <div>
                        <img src="../resources/logo_littlefoot.png" class="logo-abs"/>
                    </div>
                </div>
            </div>
            <div id="block-questionnaire" class="hidden">
                <div class="content">
                    <div id="content-questionnaire" class="center">
                    </div>
                    <div class="center">
                        <img src="../resources/qrcode.png" class="qrcode-img" />
                        <div class="qrcode-link">
                            <a href="https://qrfy.io/BzjaHjgloC">問卷連結</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
